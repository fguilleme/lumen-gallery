[project]
name = "lumen-gallery"
version = "0.1.0"
description = "Private local photographer gallery backend"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pillow>=11,<13",
  "python-multipart>=0.0.18,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
